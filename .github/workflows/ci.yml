name: Tanger checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run art:lab:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run art:test:e2e
